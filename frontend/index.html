<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhatsApp Tagging Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>WA Tagger</h1>

      <section>
        <h2>Tags</h2>
        <div id="tag-list" class="tag-list"></div>
        <form id="tag-form" class="inline-form">
          <input type="text" id="new-tag-name" placeholder="New tag name" required />
          <button type="submit">Add</button>
        </form>
      </section>

      <section>
        <h2>Filter</h2>
        <select id="tag-filter">
          <option value="">All contacts</option>
        </select>
      </section>

      <section>
        <h2>Broadcast to tag</h2>
        <form id="broadcast-form" class="stack-form">
          <select id="broadcast-tag" required></select>
          <input type="text" id="broadcast-template" placeholder="Approved template name" required />
          <input type="text" id="broadcast-lang" placeholder="Language code (e.g. en_US)" value="en_US" />
          <input type="text" id="broadcast-params" placeholder="Params, comma-separated" />
          <button type="submit">Send Broadcast</button>
        </form>
        <div id="broadcast-result"></div>
      </section>
    </aside>

    <main class="main">
      <div class="toolbar">
        <h2>Contacts</h2>
        <form id="contact-form" class="inline-form">
          <input type="text" id="new-contact-number" placeholder="WhatsApp number (e.g. 919876543210)" required />
          <input type="text" id="new-contact-name" placeholder="Name (optional)" />
          <button type="submit">Add Contact</button>
        </form>
      </div>

      <table id="contacts-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Number</th>
            <th>Tags</th>
            <th>Last message</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contacts-body"></tbody>
      </table>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
